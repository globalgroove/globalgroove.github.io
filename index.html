<!-- #####################################################################
     HOW THIS FILE IS ORGANISED
     #####################################################################
     You only ever edit the three blocks right below, in this order:

       1. AGENDA       the lines of the agenda: title, date and the name of its details.   (edit most often)
       2. EVENT TEXTS  the text of each event, one named entry per event: poster, venue, time, text, link.
       3. SETTINGS     menu, logo, side tab, image, table height.                            (edit rarely)

     Everything after the line "END OF CONTENT" is code and does not need editing.

     How the blocks connect: a line of the AGENDA can end with a name, for example "cannibe".
     When someone clicks that line, the entry called cannibe in EVENT TEXTS opens in the frame on the right.
     A line without a name still shows, it just opens nothing.

     To add an event:  1) add a line to the AGENDA   2) add an entry with the same name to EVENT TEXTS.

     Rules for all three blocks:
       - Keep the quotation marks "like this" and the commas at line ends (the last item of a list has no comma).
       - A quotation mark inside a text needs a backslash: "12\" LP"
       - Paragraphs may contain simple HTML, e.g. <em>italic</em> or <a href="...">a link</a>.
       - Image and file paths are relative to the site root.
     ##################################################################### -->

     Each { title, rows } is a separate table with its own heading, shown in the order written here.
     Add  tools: true  to a table to give it the search field and the year index (and the year rows).
     (A plain [ ... ] list of lines still works: it becomes a table with no heading and no tools.)
     Lines keep the order written here. A table taller than the height limit (see SETTINGS) scrolls.

     YEARS (tables with tools: true): write the full date, year first ("2026 . 11 . 14"). The rows of that table show only
     month and day ("11 . 14"); the year is read from the date and drives the year rows and the year index. Whenever the year changes from one line to the next,
     a small year row appears by itself (and stays pinned at the top while you scroll). You never type the year rows.
     Just keep the lines in order. A line whose date has no year (like "OUT") stays under the previous year.

     SEARCH (same tables): the search field looks at the title, the date and the event's details and text (accents and capitals ignored).
     ===================================================================== -->

<style>
/* STYLE SHEET. Same variables as the other pages. It moves to assets/css/style.css in the next step.
   --frame is the thickness of the outer lines of the tables: 1px = light, 3px = heavy like the printed sheet. */
:root{
  --paper:#ECEBE6; --ink:#141413; --rule:#8d8b84; --tab-text:#ECEBE6; --frame:1px; --accent:#7a3cf0;
  --label:"IBM Plex Sans Condensed","Zen Kaku Gothic New","Arial Narrow",Arial,sans-serif;
  --value:"IBM Plex Mono","Zen Kaku Gothic New",ui-monospace,Menlo,Consolas,monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--paper:#171716;--ink:#E6E4DD;--rule:#6b6963;--tab-text:#171716;--accent:#a98bff}
}
:root[data-theme="dark"]{--paper:#171716;--ink:#E6E4DD;--rule:#6b6963;--tab-text:#171716;--accent:#a98bff}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-behavior:smooth;scroll-padding-top:56px}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--label);font-size:15px;line-height:1.35;min-height:100%}
.page{position:relative;max-width:1000px;margin:0 auto;padding:28px 56px 48px 20px;overflow-x:clip}
.page.no-tabs{padding-right:20px}
a{color:inherit;text-decoration-thickness:1px;text-underline-offset:3px}
a:focus-visible,button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

/* site menu: small sticky title top-left; clicking it opens a ruled list of links */
.site{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;width:max-content;max-width:100%;margin:0 0 12px;display:flex;align-items:center;gap:12px;background:var(--paper);padding-right:8px}
.logo{display:block;flex:none;width:28px;height:28px;color:var(--ink)}
.logo svg,.logo img,.logo canvas{display:block;width:100%;height:100%}
.logo img{object-fit:contain;object-position:left center}
.logo:hover{opacity:.7}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.site-btn{display:block;background:var(--paper);color:var(--ink);border:0;padding:3px 8px 3px 0;font:500 14px/1.3 var(--label);letter-spacing:.14em;cursor:pointer;text-align:left}
.site-btn::after{content:"+";font-family:var(--value);margin-left:.8em;letter-spacing:0}
.site-btn[aria-expanded=true]::after{content:"\2212"}
.site-btn.static{cursor:default}
.site-btn.static::after{content:""}
.site-menu{position:absolute;top:100%;left:0;margin:2px 0 0;padding:0;list-style:none;min-width:200px;background:var(--paper);border:1px solid var(--rule)}
.site-menu li+li{border-top:1px solid var(--rule)}
.site-menu a{display:block;padding:6px 12px 6px 8px;font-size:14px;letter-spacing:.08em;text-decoration:none}
.site-menu a::before{content:"";display:inline-block;width:1.2em}
.site-menu a[aria-current]::before{content:"\25CF"}
.site-menu a:hover,.site-menu a:focus-visible{background:var(--ink);color:var(--paper);outline:none}

/* logo placeholder marks. "registration" uses the ink colour only; "lens" is ink plus paper-coloured cut-outs */
.logo .ink{fill:currentColor}
.logo .cut{fill:var(--paper);stroke:none}
.logo .cutl{fill:none;stroke:var(--paper);stroke-linecap:round}

/* side tabs: the label of this page, plus the next page as an outlined link when nextPage is set */
.tabs-side{position:fixed;right:0;top:46%;z-index:5;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.tab-side{background:var(--ink);color:var(--tab-text);writing-mode:vertical-rl;font:500 22px/1 var(--value);padding:16px 8px;letter-spacing:.06em}
a.tab-side{text-decoration:none;cursor:pointer;background:var(--paper);color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
a.tab-side:hover,a.tab-side:focus-visible{background:var(--ink);color:var(--tab-text);outline:none}

/* two columns: LEFT (narrower) = the image, or the open event frame; RIGHT (wider) = the agenda tables stacked: upcoming, then past events with search and years. */
.cols{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);grid-template-areas:"fig past";gap:0 28px;align-items:start}
.col-l{display:contents}
aside{grid-area:fig;min-width:0}
main{grid-area:past;min-width:0}      /* upcoming and past events stack in the right column; the frame / image on the left starts at the same height */
.text{margin:0 0 18px}
.text[hidden]{display:none}
.text p{margin:0 0 .8em;font:400 15px/1.55 var(--label);hyphens:auto}
.text p:last-child{margin-bottom:0}

/* agenda: a table without lines, same type as the old info lines. A line is clickable; the open one stays black */
.ag-scroll{margin:0 0 1.4em -8px;overflow:auto;scrollbar-width:thin;scrollbar-color:var(--rule) transparent}
.ag-scroll::-webkit-scrollbar{width:6px;height:6px}
.ag-scroll::-webkit-scrollbar-thumb{background:var(--rule)}
.agenda{border-collapse:separate;border-spacing:0 2px;margin:0}
.agenda th{font:400 14px/1.35 var(--label);letter-spacing:.14em;text-align:left;padding:2px 28px 2px 8px;vertical-align:top}
.agenda td{font:400 13px/1.4 var(--value);padding:2px 8px 2px 0;vertical-align:top;white-space:nowrap}
.agenda tr:not(.yr){cursor:pointer}
.agenda tr:not(.yr):hover>*,.agenda tr.on>*{background:var(--ink);color:var(--paper)}
.agenda tr:has(.ev:focus-visible)>*{background:var(--ink);color:var(--paper)}
.agenda .ev{font:inherit;letter-spacing:inherit;color:inherit;background:none;border:0;padding:0;margin:0;text-align:left;cursor:pointer}
.agenda .ev:focus-visible{outline:2px solid var(--paper);outline-offset:1px}
.agenda tr[hidden],.ag-scroll[hidden]{display:none}

/* year rows: small, letter-spaced, a thin rule above; the current year stays pinned at the top of the scrolling table */
.agenda .yr th{position:sticky;top:0;z-index:2;background:var(--paper);color:var(--ink);padding:9px 8px 4px;font:700 12px/1 var(--value);letter-spacing:.24em;border-top:1px solid var(--rule);border-bottom:1px solid var(--ink)}
.agenda tbody tr:first-child.yr th{border-top:0;padding-top:2px}

/* search field and year index, above the agenda */
.ag-sec{margin:0 0 2.2em}
.ag-sec:last-child{margin-bottom:0}
.ag-head{display:flex;align-items:center;gap:8px 16px;margin:0 0 10px}
.ag-head .ag-h{margin:0;flex:0 0 auto}
.ag-h{margin:0 0 10px;font:700 15px/1.2 var(--label);letter-spacing:.14em;text-transform:uppercase}
.ag-tools{display:flex;align-items:center;gap:12px;margin:0 0 0 auto;min-width:0;flex:0 1 300px;justify-content:flex-end}
.ag-tools[hidden],.ag-years[hidden]{display:none}
.ag-box{position:relative;flex:1 1 180px;min-width:0}
.ag-box input{display:block;width:100%;font:400 13px/1.3 var(--value);color:var(--ink);background:transparent;border:1px solid var(--rule);border-radius:0;padding:5px 28px 5px 8px;-webkit-appearance:none;appearance:none}
.ag-box input::placeholder{color:var(--rule);letter-spacing:.14em}
.ag-box input::-webkit-search-cancel-button{-webkit-appearance:none}
.ag-box input:focus{outline:none;border-color:var(--ink)}
.ag-box input:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.ag-x{position:absolute;right:2px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--ink);font:400 16px/1 var(--value);padding:3px 7px;cursor:pointer}
.ag-x[hidden]{display:none}
.ag-count:empty{display:none}
.ag-count{font:400 12px/1 var(--value);white-space:nowrap}
.ag-years{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin:0 0 10px;font:400 12px/1.4 var(--value)}
.ag-years button{background:none;border:0;padding:1px 4px;margin:0 -4px;font:inherit;letter-spacing:.14em;color:inherit;cursor:pointer}
.ag-years button:hover,.ag-years button:focus-visible{background:var(--ink);color:var(--paper)}

/* info lines (used inside the event frame) */
.meta{display:grid;grid-template-columns:auto 1fr;gap:4px 28px;margin:2px 0 18px;font-size:14px}
.meta dt{letter-spacing:.14em}
.meta dd{margin:0;font-family:var(--value);font-size:13px}

/* event frame (left column): poster, title, details, text, link. Stays in view while the past events scroll */
aside{align-self:stretch}
.detail{position:sticky;top:56px;border:1px solid var(--rule)}
.detail[hidden]{display:none}
.detail .close{position:absolute;top:6px;right:6px;z-index:2;background:var(--paper);color:var(--ink);border:1px solid var(--rule);font:500 11px/1 var(--label);letter-spacing:.14em;padding:4px 8px;cursor:pointer}
.detail .close:hover,.detail .close:focus-visible{background:var(--ink);color:var(--paper)}
.detail .flip{position:absolute;top:6px;left:6px;z-index:2;background:var(--paper);color:var(--ink);border:1px solid var(--rule);font:500 11px/1 var(--label);letter-spacing:.14em;padding:4px 8px;cursor:pointer}
.detail .flip:hover,.detail .flip:focus-visible{background:var(--ink);color:var(--paper)}
.detail .flip[hidden]{display:none}
.detail .stage{position:relative}
.detail .info{position:absolute;inset:0;z-index:1;overflow:auto;background:var(--paper);padding:40px 12px 12px;scrollbar-width:thin;scrollbar-color:var(--rule) transparent}
.detail .info[hidden]{display:none}
.detail.has-info .poster{cursor:pointer}
.detail .poster{position:relative;aspect-ratio:3/4;min-height:300px;max-height:70vh;width:100%;background:radial-gradient(circle at 50% 50%,var(--rule) 0 1px,transparent 1.4px) 0 0/5px 5px}
.detail .poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;background:var(--paper)}
.detail .poster img[hidden]{display:none}
.detail .body{padding:10px 12px 10px;border-top:1px solid var(--rule)}
.detail h3{margin:0 0 2px;font:500 14px/1.3 var(--label);letter-spacing:.14em}
.detail .when{font:400 13px/1.4 var(--value)}
.detail .meta{margin:0 0 12px;gap:3px 18px;font-size:13px}
.detail .meta dd{font-size:12px}
.detail .meta[hidden]{display:none}
.detail p{margin:0 0 .7em;font:400 14px/1.5 var(--label)}
.detail .more{margin:0}

/* image */
.fig-wrap{margin:0}
.halftone{aspect-ratio:1.6/1;background:radial-gradient(circle at 50% 50%,var(--ink) 0 1.1px,transparent 1.5px) 0 0/5px 5px;-webkit-mask-image:radial-gradient(ellipse 48% 44% at 52% 54%,#000 30%,transparent 100%);mask-image:radial-gradient(ellipse 48% 44% at 52% 54%,#000 30%,transparent 100%)}
.frame{position:relative;aspect-ratio:1.6/1;background:radial-gradient(circle at 50% 50%,var(--rule) 0 1px,transparent 1.4px) 0 0/5px 5px}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;background:var(--paper)}
.frame img[hidden]{display:none}

@media (max-width:760px){
  .page{padding:20px 44px 40px 12px}
  .page.no-tabs{padding-right:12px}

  main,aside{grid-area:auto}
  main{order:1} aside{order:2;align-self:start}
  .detail{position:static}
  .tab-side{font-size:18px;padding:12px 6px}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}tbody tr{transition:none}}
</style>

<body>
<!-- PAGE SKELETON. Empty containers: the builder script fills them from the PAGE block above. -->
<div class="page" id="top">

  <!-- site menu: the title button opens the list (filled from PAGE.site) and stays visible while scrolling -->
  <h1 class="sr" id="h1"></h1>

  <!-- site bar: logo (links home) + menu title. Stays visible while scrolling -->
  <nav class="site" id="site" aria-label="Site">
    <a class="logo" id="logo"></a>
    <button type="button" class="site-btn" id="site-btn" aria-expanded="false" aria-controls="site-menu"><span id="site-title"></span></button>
    <ul class="site-menu" id="site-menu" hidden></ul>
  </nav>

  <!-- side tab: this page's label (+ a link box to the next page when nextPage is set) -->
  <div class="tabs-side" id="tabs-side"><div class="tab-side" id="tab-side" aria-hidden="true"></div></div>

  <div class="cols">

    <!-- left column: the image (no border, no caption) until a line is clicked; then the event frame -->
    <div class="col-l">
      <aside>
        <figure class="fig-wrap" id="fig"></figure>
        <section class="detail" id="detail" hidden aria-label="Event details">
          <button type="button" class="close" id="d-close">Close</button>
          <button type="button" class="flip" id="d-flip" aria-pressed="false" hidden>Info</button>
          <div class="stage" id="d-stage">
            <div class="poster" id="d-poster"></div>
            <!-- the details sit behind the poster: click the poster (or the Info button) to read them, click again to go back -->
            <div class="info" id="d-info" hidden>
              <dl class="meta" id="d-meta"></dl>
              <div id="d-text"></div>
              <p class="more"><a id="d-link" target="_blank" rel="noopener" hidden></a></p>
            </div>
          </div>
          <div class="body">
            <h3 id="d-title"></h3>
            <div class="when" id="d-date"></div>
          </div>
        </section>
      </aside>
    </div>

    <!-- right column: the agenda tables built from AGENDA (upcoming first, then past events) and the optional intro text -->
    <main>
      <div class="ag-tools" id="ag-tools" hidden>   <!-- the builder moves this under the heading of the table that has tools: true -->
        <div class="ag-box">
          <input type="search" id="ag-q" placeholder="SEARCH" aria-label="Search the agenda" autocomplete="off" spellcheck="false">
          <button type="button" class="ag-x" id="ag-x" aria-label="Clear search" hidden>&times;</button>
        </div>
        <span class="ag-count" id="ag-count" aria-live="polite"></span>
      </div>
      <p class="ag-years" id="ag-years" hidden></p>   <!-- the builder places this under the heading row -->
      <div id="agenda-up"></div>
      <div id="agenda"></div>
      <div class="text" id="text"></div>
    </main>

  </div>

</div>

<!-- BUILDER SCRIPT. Reads the PAGE block and fills the skeleton above. No need to edit. -->
<script>
(function(){
  try {
    var C = PAGE, root = C.root || '';
    function $(id){ return document.getElementById(id); }
    function el(tag, cls, text){ var e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }
    function pad(n){ return String(n).padStart(3,'0'); }

    // page identity
    document.title = C.browserTitle;
    $('h1').textContent = C.site ? C.site.title : C.browserTitle;   // hidden page heading for screen readers

    // placeholder logo, two options (config: logo.mark):
    //   "registration": a thin square with a circle and crosshair ticks, like a printer's registration mark (ink colour only)
    //   "lens": a black ellipse with a tall hollow ring, a small crossbar and two wedges cutting in from the sides
    function logoMark(host, which){
      var marks = {
        registration:
          '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x=".5" y=".5" width="23" height="23" fill="none" stroke="currentColor" vector-effect="non-scaling-stroke"/>' +
          '<circle cx="12" cy="12" r="5" fill="none" stroke="currentColor" vector-effect="non-scaling-stroke"/>' +
          '<path d="M12 0v7M12 17v7M0 12h7M17 12h7" stroke="currentColor" vector-effect="non-scaling-stroke"/></svg>',
        lens:
          '<svg viewBox="0 0 28 28" aria-hidden="true" focusable="false"><ellipse class="ink" cx="14" cy="14" rx="10.5" ry="13.2"/>' +
          '<ellipse class="cutl" cx="14" cy="14" rx="3.2" ry="12.2" stroke-width="1.5"/>' +
          '<path class="cutl" stroke-width="1.4" d="M10.9 16.4H17.1M17.1 12.4H15.4"/>' +
          '<path class="cut" d="M0 12.2 7 15.2 0 18.4Z"/><path class="cut" d="M28 12 21 15 28 18.2Z"/></svg>'
      };
      host.innerHTML = marks[which] || marks.registration;
    }

    // logo: small mark left of the menu title, links to the site root. Empty src (or a missing file) = the placeholder mark
    var logo = $('logo'), lg = C.logo || {};
    logo.href = root || './';
    logo.setAttribute('aria-label', lg.alt || 'Home');
    if (lg.src) {
      var lim = new Image(); lim.src = root + lg.src; lim.alt = '';
      lim.onerror = function(){ logoMark(logo, lg.mark); };
      logo.appendChild(lim);
    } else logoMark(logo, lg.mark);

    // side tab: text from sideLabel (or the page number); with nextPage set, a second outlined box (number+1) links to the next page
    if (C.showTabs) {
      $('tab-side').textContent = C.sideLabel || pad(C.number);
      if (C.nextPage) {
        var next = el('a', 'tab-side', pad(C.number + 1));
        next.href = root + C.nextPage;
        next.setAttribute('aria-label', 'Next page, ' + pad(C.number + 1));
        $('tabs-side').appendChild(next);
      }
    } else {
      $('tabs-side').remove();
      document.querySelector('.page').classList.add('no-tabs');
    }

    // site menu: links to sections of this page; the section being read gets a bullet; closes after a click, outside click or Esc
    var btn = $('site-btn'), menu = $('site-menu'), links = (C.site && C.site.links) || [], spy = [];
    $('site-title').textContent = C.site ? C.site.title : '';
    links.forEach(function(l){
      var li = el('li'), a = el('a', null, l[0]), hash = l[1].charAt(0) === '#';
      a.href = hash ? l[1] : root + l[1];
      if (hash) spy.push({ a: a, id: l[1].slice(1) });
      li.appendChild(a); menu.appendChild(li);
    });
    if (!links.length) { btn.classList.add('static'); btn.removeAttribute('aria-expanded'); btn.removeAttribute('aria-controls'); }
    else {
      var setOpen = function(o){ menu.hidden = !o; btn.setAttribute('aria-expanded', o); };
      btn.addEventListener('click', function(){ setOpen(menu.hidden); });
      menu.addEventListener('click', function(e){ if (e.target.closest('a')) setOpen(false); });
      document.addEventListener('click', function(e){ if (!$('site').contains(e.target)) setOpen(false); });
      document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && !menu.hidden) { setOpen(false); btn.focus(); } });
    }
    function onScroll(){                      // mark the last section whose heading has reached the top
      var cur = null;
      spy.forEach(function(s){ var t = $(s.id); if (t && t.getBoundingClientRect().top <= 120) cur = s.a; });
      spy.forEach(function(s){ if (s.a === cur) s.a.setAttribute('aria-current', 'location'); else s.a.removeAttribute('aria-current'); });
    }
    if (spy.length) { window.addEventListener('scroll', onScroll, { passive: true }); onScroll(); }

    // agenda: one table per block of AGENDA (a blank line between blocks). Click a line: its entry in TEXTS opens in the frame on the right.
    // Click the open line again, press Close or Esc to go back to the image.
    var detail = $('detail'), figBox = $('fig'), current = null;
    function narrow(){ return window.matchMedia && matchMedia('(max-width:760px)').matches; }
    function paragraphs(box, v){ box.innerHTML = ''; (Array.isArray(v) ? v : [v]).filter(Boolean).forEach(function(t){ var p = el('p'); p.innerHTML = t; box.appendChild(p); }); }
    function showInfo(on){                               // poster <-> details, in the same frame (the frame never grows)
      $('d-info').hidden = !on; $('d-info').scrollTop = 0;
      var f = $('d-flip'); f.textContent = on ? 'Poster' : 'Info'; f.setAttribute('aria-pressed', on ? 'true' : 'false');
    }
    function toggleInfo(){ if (detail.classList.contains('has-info')) showInfo($('d-info').hidden); }
    function openEvent(tr, ev){
      if (current) { current.classList.remove('on'); current.querySelector('.ev').setAttribute('aria-expanded', 'false'); }
      current = tr; tr.classList.add('on'); tr.querySelector('.ev').setAttribute('aria-expanded', 'true');
      $('d-title').textContent = ev.title; $('d-date').textContent = ev.date || '';
      var pbox = $('d-poster'); pbox.innerHTML = ''; pbox.style.aspectRatio = '';
      if (ev.poster) {                                   // the frame takes the poster's own proportions once it has loaded
        var im = new Image(); im.alt = ev.alt || '';
        im.onload = function(){ pbox.style.aspectRatio = im.naturalWidth + '/' + im.naturalHeight; };
        im.onerror = function(){ im.hidden = true; };
        im.src = root + ev.poster; pbox.appendChild(im);
      }
      var meta = $('d-meta'); meta.innerHTML = '';
      (ev.details || []).forEach(function(r){ meta.appendChild(el('dt', null, r[0])); meta.appendChild(el('dd', null, r[1])); });
      meta.hidden = !(ev.details && ev.details.length);
      paragraphs($('d-text'), ev.text);
      var lk = $('d-link'); lk.hidden = !ev.link;
      if (ev.link) { lk.href = ev.link; lk.textContent = ev.linkText || 'More info'; }
      var hasInfo = !!((ev.details && ev.details.length) || [].concat(ev.text || []).filter(Boolean).length || ev.link);
      detail.classList.toggle('has-info', hasInfo); $('d-flip').hidden = !hasInfo;
      showInfo(false);                                   // every event opens on its poster
      figBox.hidden = true; detail.hidden = false;
      if (narrow()) detail.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    function closeEvent(){
      if (!current) return;
      var b = current.querySelector('.ev'); current.classList.remove('on'); b.setAttribute('aria-expanded', 'false'); current = null;
      detail.hidden = true; figBox.hidden = false;
      if (narrow()) b.scrollIntoView({ block: 'center' });
      b.focus();
    }
    // blocks, search and years: each block remembers its rows so the search can hide them; each year remembers its first row
    var blocks = [], yearFirst = {}, yearOrder = [];
    function norm(s){ return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase(); }   // accents and capitals ignored
    var toolsBlock = null;
    AGENDA.forEach(function(block){
      if (Array.isArray(block)) block = { rows: block };            // a plain list of lines also works
      var table = el('table', 'agenda'), body = el('tbody'), items = [], lastYear = null, markerAt = -1, blk = { wrap: null, items: items, tools: !!block.tools };
      var sec = el('section', 'ag-sec');
      var head = el('div', 'ag-head');                   // heading row: the title, and (tools: true) the search field on the same line
      if (block.title) head.appendChild(el('h2', 'ag-h', block.title));
      if (block.tools && !toolsBlock) { toolsBlock = blk; head.appendChild($('ag-tools')); }
      if (head.children.length) sec.appendChild(head);
      if (block.tools && toolsBlock === blk) sec.appendChild($('ag-years'));
      block.rows.forEach(function(row){                       // row = [ title, date, name of its entry in TEXTS ]
        var ym = /\b(?:19|20)\d{2}\b/.exec(row[1] || ''), yr = ym ? ym[0] : null;
        if (blk.tools && yr && yr !== lastYear) {         // the year changed: add a small year row
          lastYear = yr;
          var ytr = el('tr', 'yr'), yth = el('th', null, yr); yth.colSpan = 2; yth.scope = 'rowgroup';
          ytr.appendChild(yth);
          if (markerAt > -1) { body.insertBefore(ytr, items[markerAt].tr); items.splice(markerAt, 0, { yr: true, tr: ytr }); }   // month markers like "OUT" go under the year row
          else { body.appendChild(ytr); items.push({ yr: true, tr: ytr }); }
          if (!yearFirst[yr]) { yearFirst[yr] = { tr: ytr, blk: blk }; yearOrder.push(yr); }
        }
        var ev = Object.assign({ title: row[0], date: row[1] }, row[2] ? (TEXTS[row[2]] || {}) : {});
        var tr = el('tr'), th = el('th'), b = el('button', 'ev', ev.title);
        th.scope = 'row'; b.type = 'button'; b.setAttribute('aria-expanded', 'false'); b.setAttribute('aria-controls', 'detail');
        var shown = ev.date || '';
        if (blk.tools && yr) shown = shown.replace(yr, '').replace(/^[\s.\-\/]+|[\s.\-\/]+$/g, '');   // under a year row the year is not repeated: 2026 . 11 . 14 shows as 11 . 14 (the full date stays in the data, the search and the event frame)
        th.appendChild(b); tr.appendChild(th); tr.appendChild(el('td', null, shown));
        tr.addEventListener('click', function(){ if (current === tr) closeEvent(); else openEvent(tr, ev); });
        b.addEventListener('click', function(e){ e.stopPropagation(); if (current === tr) closeEvent(); else openEvent(tr, ev); });
        body.appendChild(tr);
        if (yr) markerAt = -1; else if (markerAt < 0) markerAt = items.length;      // remember where a run of lines without a year starts
        items.push({ tr: tr, hay: norm([ev.title, ev.date, (ev.details || []).map(function(d){ return d.join(' '); }).join(' '), [].concat(ev.text || []).join(' ').replace(/<[^>]*>/g, ' ')].join(' ')) });
      });
      var wrap = el('div', 'ag-scroll');                // height limit: a block taller than agendaMaxHeight scrolls
      wrap.style.maxHeight = C.agendaMaxHeight || '55vh';
      table.appendChild(body); wrap.appendChild(table); sec.appendChild(wrap); (block.tools ? $('agenda') : $('agenda-up')).appendChild(sec);   // both end up stacked in the right column, in the order written
      blk.wrap = wrap; blocks.push(blk);
    });

    // search: every word typed must appear in the title, date, details or text of a line. Empty year rows and empty blocks hide.
    var q = $('ag-q'), xBtn = $('ag-x'), countEl = $('ag-count');
    function filter(){
      var terms = norm(q.value).split(/\s+/).filter(Boolean), shown = 0;
      xBtn.hidden = !terms.length;
      blocks.forEach(function(b){
        if (!b.tools) return;                            // only the table that owns the search is filtered
        var any = 0, pending = null, n = 0;
        b.items.forEach(function(it){
          if (it.yr) { if (pending) pending.tr.hidden = !n; pending = it; n = 0; return; }
          var ok = terms.every(function(t){ return it.hay.indexOf(t) > -1; });
          it.tr.hidden = !ok; if (ok) { n++; any++; }
        });
        if (pending) pending.tr.hidden = !n;
        b.wrap.hidden = !any; shown += any;
      });
      countEl.textContent = terms.length ? (shown ? shown + (shown === 1 ? ' result' : ' results') : 'No results') : '';
    }
    if (!toolsBlock || C.agendaSearch === false) { $('ag-tools').hidden = true; }
    else {
      $('ag-tools').hidden = false;
      q.addEventListener('input', filter);
      q.addEventListener('keydown', function(e){ if (e.key === 'Escape' && q.value) { q.value = ''; filter(); e.stopPropagation(); } });
      xBtn.addEventListener('click', function(){ q.value = ''; filter(); q.focus(); });
    }

    // year index: 2026 · 2025 · 2024. Each year scrolls its table to that year (only when there is more than one year)
    var yBox = $('ag-years');
    if (toolsBlock && C.agendaYearIndex !== false && yearOrder.length > 1) {
      yearOrder.forEach(function(y, i){
        if (i) { var dot = el('span', null, '\u00b7'); dot.setAttribute('aria-hidden', 'true'); yBox.appendChild(dot); }
        var yb = el('button', null, y); yb.type = 'button';
        yb.addEventListener('click', function(){
          var t = yearFirst[y], w = t.blk.wrap, next = t.tr.nextElementSibling || t.tr;
          if (q.value) { q.value = ''; filter(); }
          w.scrollTop += next.getBoundingClientRect().top - w.getBoundingClientRect().top - t.tr.getBoundingClientRect().height;
          w.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
        yBox.appendChild(yb);
      });
      yBox.hidden = false;
    }
    $('d-close').addEventListener('click', closeEvent);
    $('d-flip').addEventListener('click', toggleInfo);
    $('d-poster').addEventListener('click', toggleInfo);
    document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && !detail.hidden && menu.hidden) closeEvent(); });

    // intro text (paragraphs may contain simple HTML); an empty list hides it
    var box = $('text');
    if (!C.text || !C.text.length) { box.hidden = true; }
    else C.text.forEach(function(t){ var p = el('p'); p.innerHTML = t; box.appendChild(p); });

    // image: halftone placeholder when there is no file, otherwise the picture in a 3:2 frame
    var fig = $('fig'), f = C.figure;
    if (!f.src) {
      var h = el('div', 'halftone'); h.setAttribute('role', 'img'); h.setAttribute('aria-label', f.alt || 'Image placeholder'); fig.appendChild(h);
    } else {
      var fr = el('div', 'frame'), im = new Image();
      im.src = root + f.src; im.alt = f.alt || ''; im.loading = 'lazy'; im.onerror = function(){ im.hidden = true; };
      fr.appendChild(im); fig.appendChild(fr);
    }
  } catch (e) {
    console.error(e);
    document.body.insertAdjacentHTML('afterbegin', '<p style="padding:12px;font:14px monospace">Content error: check the quotation marks and commas in the content block at the top of the file.</p>');
  }
})();
</script>
</body>
</html>
